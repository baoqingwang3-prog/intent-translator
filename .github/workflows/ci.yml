name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Stranger-user smoke
        run: python scripts/stranger_smoke.py
      - name: Privacy and release audit
        run: python scripts/release_audit.py --repo .
      - name: Compile Python
        run: python -m compileall -q skills src tests scripts
      - name: MCP import smoke test
        run: python -c "from intent_translator_mcp.server import mcp; print('MCP import passed')"
      - name: Release metadata
        run: python tests/check_release_metadata.py
      - name: Environment smoke test
        run: python skills/intent-translator/scripts/detect_environment.py --compact
      - name: Skill discovery smoke test
        run: python skills/intent-translator/scripts/discover_skills.py --root skills --compact
      - name: Unix installer syntax
        if: runner.os != 'Windows'
        run: sh -n install.sh install-mcp.sh uninstall.sh uninstall-mcp.sh
      - name: Unix installer smoke test
        if: runner.os != 'Windows'
        run: |
          sh ./install.sh --destination "$RUNNER_TEMP/intent-compiler-skills" --skip-profile
          test -f "$RUNNER_TEMP/intent-compiler-skills/intent-translator/SKILL.md"
          sh ./install.sh --destination "$RUNNER_TEMP/intent-compiler-skills" --skip-profile --replace
          touch "$RUNNER_TEMP/intent-compiler-skills/intent-translator/rollback-marker"
          if INTENT_TRANSLATOR_TEST_FAIL_AFTER_BACKUP=1 sh ./install.sh --destination "$RUNNER_TEMP/intent-compiler-skills" --skip-profile --replace; then exit 1; fi
          test -f "$RUNNER_TEMP/intent-compiler-skills/intent-translator/rollback-marker"
      - name: Windows installer smoke test
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./install.ps1 -Destination "$env:RUNNER_TEMP\intent-compiler-skills" -SkipProfile
          if (-not (Test-Path "$env:RUNNER_TEMP\intent-compiler-skills\intent-translator\SKILL.md")) { exit 1 }
          ./install.ps1 -Destination "$env:RUNNER_TEMP\intent-compiler-skills" -SkipProfile -Replace
          Set-Content "$env:RUNNER_TEMP\intent-compiler-skills\intent-translator\rollback-marker" "present"
          $env:INTENT_TRANSLATOR_TEST_FAIL_AFTER_BACKUP = "1"
          try {
            ./install.ps1 -Destination "$env:RUNNER_TEMP\intent-compiler-skills" -SkipProfile -Replace
            exit 1
          } catch {
            Write-Host "Expected rollback test failure: $($_.Exception.Message)"
          } finally {
            Remove-Item Env:INTENT_TRANSLATOR_TEST_FAIL_AFTER_BACKUP
          }
          if (-not (Test-Path "$env:RUNNER_TEMP\intent-compiler-skills\intent-translator\rollback-marker")) { exit 1 }
      - name: Windows script parse check
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD\install-mcp.ps1", [ref]$null, [ref]$errors)
          [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD\uninstall-mcp.ps1", [ref]$null, [ref]$errors)
          [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD\install.ps1", [ref]$null, [ref]$errors)
          [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD\uninstall.ps1", [ref]$null, [ref]$errors)
          [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD\setup-codex.ps1", [ref]$null, [ref]$errors)
          if ($errors) { $errors | Format-List; exit 1 }

  browser-smoke:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ms-playwright
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install package and pinned browser driver
        run: |
          python -m pip install .
          npm install --no-save --package-lock=false playwright@1.61.1
          npx playwright install --with-deps chromium
      - name: Studio desktop and mobile smoke
        run: python scripts/studio_browser_smoke.py --node-modules node_modules
