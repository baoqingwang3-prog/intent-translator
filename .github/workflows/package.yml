name: Package

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify tag and versions
        run: python tests/check_release_metadata.py --tag "${GITHUB_REF_NAME:-}"
      - name: Build distributions
        run: |
          python -m pip install build
          python -m build
      - name: Inspect wheel
        run: |
          python -m venv "$RUNNER_TEMP/package-test"
          "$RUNNER_TEMP/package-test/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/package-test/bin/intent-translator-doctor" --json
      - uses: actions/upload-artifact@v4
        with:
          name: intent-translator-distributions
          path: dist/*
          if-no-files-found: error
