name: Package

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify tag and versions
        run: python tests/check_release_metadata.py --tag "${GITHUB_REF_NAME:-}"
      - name: Release quality gate
        run: |
          python -m pip install build
          python scripts/release_gate.py --mode ci
      - name: Build distributions
        run: python -m build
      - name: Install wheel and run doctor
        run: |
          python -m venv "$RUNNER_TEMP/package-test"
          "$RUNNER_TEMP/package-test/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/package-test/bin/intent-translator-doctor" --json
          "$RUNNER_TEMP/package-test/bin/intent-translator-onboard" --memory local --interpretation choices --tone concise --json
          "$RUNNER_TEMP/package-test/bin/intent-translator-studio" --help
          "$RUNNER_TEMP/package-test/bin/python" -c "from intent_translator_mcp.server import mcp; assert mcp"
          python scripts/generate_sbom.py --python "$RUNNER_TEMP/package-test/bin/python" --output dist/intent-translator-sbom.cdx.json
      - name: Inspect distributions and SBOM
        run: python scripts/release_audit.py --repo . --dist dist
      - name: Attest build provenance
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: intent-translator-distributions
          path: dist/*
          if-no-files-found: error
