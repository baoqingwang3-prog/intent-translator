[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "intent-translator-mcp"
version = "0.7.1a2"
description = "Local-first intent compiler SDK and routing MCP server"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Personal Intent Compiler contributors" }]
keywords = ["agent-skills", "mcp", "intent", "local-first", "prompt-engineering"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
  "mcp>=1.9,<2",
  "pydantic>=2.11,<3",
]

[project.urls]
Homepage = "https://github.com/baoqingwang3-prog/intent-translator"
Repository = "https://github.com/baoqingwang3-prog/intent-translator"
Issues = "https://github.com/baoqingwang3-prog/intent-translator/issues"
Documentation = "https://github.com/baoqingwang3-prog/intent-translator/blob/main/README.md"

[project.scripts]
intent-translator-mcp = "intent_translator_mcp.server:main"
intent-translator-config = "intent_translator_mcp.config:main"
intent-translator-eval = "intent_translator_mcp.ab_eval:main"
intent-translator-doctor = "intent_translator_mcp.doctor:main"
intent-translator-onboard = "intent_translator_mcp.onboarding:main"
intent-translator-semantic-eval = "intent_translator_mcp.semantic_eval:main"
intent-translator-study = "intent_translator_mcp.study_shadow:main"
intent-translator-state = "intent_translator_mcp.student_state:main"
intent-translator-studio = "intent_translator_mcp.studio:main"
intent-translator-host = "intent_translator_mcp.host_registration:main"
intent-translator-bench = "intent_translator_mcp.intentbench:main"
intent-translator-challenge = "intent_translator_mcp.challenge:main"
intent-translator-feedback = "intent_translator_mcp.feedback:main"
intent-translator-trial = "intent_translator_mcp.trial:main"
intent-translator-same-model-eval = "intent_translator_mcp.same_model_eval:main"

[tool.hatch.build.targets.wheel]
packages = ["src/intent_translator_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"benchmarks/intentbench-v1" = "intent_translator_mcp/benchmarks/intentbench-v1"
"benchmarks/intentbench-v2" = "intent_translator_mcp/benchmarks/intentbench-v2"
